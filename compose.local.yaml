name: kassensturz-local
services:
  app:
    build: .
    ports:
      - "127.0.0.1:${LOCAL_PORT:-8080}:8080"
    environment:
      APP_PASSWORD: ${LOCAL_APP_PASSWORD:?Set LOCAL_APP_PASSWORD (at least 12 characters)}
      PUBLIC_URL: ""
      ALLOW_HTTP: "1"
    volumes:
      - local-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=640m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    mem_limit: 1g
    pids_limit: 128
volumes:
  local-data:
