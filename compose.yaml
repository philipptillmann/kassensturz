# HTTPS is the server default. PUBLIC app port is never exposed.
name: kassensturz
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in .env (at least 12 characters)}
      PUBLIC_URL: https://${DOMAIN:?Set DOMAIN in .env}:${HTTPS_PORT:-${PORT:-443}}
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp:size=640m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    mem_limit: 1g
    pids_limit: 128
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      HTTPS_PORT: ${HTTPS_PORT:-${PORT:-443}}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-${PORT:-443}}:443"
    volumes:
      - ${CADDY_CONFIG:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  data:
  caddy_data:
  caddy_config:
