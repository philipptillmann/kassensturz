name: Server container
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_PASSWORD: ci-only-not-a-real-password
      DOMAIN: localhost
      HTTPS_PORT: 8443
      HTTP_PORT: 8080
      CADDY_CONFIG: ./Caddyfile.internal
    steps:
      - uses: actions/checkout@v4
      - name: Check chart calculations and JavaScript
        run: |
          node tests/test_charts.cjs
          node --check static/charts.js
          node --check static/app.js
          node --check static/login.js
      - name: Validate Compose configurations
        run: |
          docker compose config --quiet
          docker compose -f compose.https.yaml config --quiet
      - name: Build image
        run: docker build -t kassensturz:test .
      - name: Test application and real receipt OCR inside container
        run: >-
          docker run --rm --read-only --tmpfs /tmp:size=256m
          --cap-drop ALL --security-opt no-new-privileges
          -e CHECK_CONTAINER=1 kassensturz:test
          python -m unittest discover -s tests -v
      - name: Start Compose and verify persistent multi-device access
        run: |
          docker compose up -d --wait
          docker compose cp caddy:/data/caddy/pki/authorities/local/root.crt /tmp/kassensturz-root.crt
          SSL_CERT_FILE=/tmp/kassensturz-root.crt python3 tests/smoke_http.py https://localhost:8443
          docker compose restart app
          for i in $(seq 1 30); do
            curl --fail --silent --cacert /tmp/kassensturz-root.crt https://localhost:8443/healthz && break
            sleep 2
          done
          SSL_CERT_FILE=/tmp/kassensturz-root.crt python3 tests/smoke_http.py https://localhost:8443 --verify-persistence
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop test containers
        if: always()
        run: docker compose down --volumes
